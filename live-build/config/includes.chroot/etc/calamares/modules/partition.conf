# Vortara: particionado del instalador.
efiSystemPartition: "/boot/efi"
efiSystemPartitionName: "EFI"

# Vortara ya usa zram (swap comprimido en RAM). La partición de swap "small"
# se mantiene por defecto para equipos con poca RAM; se puede quitar al instalar.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small
swapPartitionName: "swap"

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

partitionLayout:
    - name: "vortara"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
