# Vortara: nombre que aparece en el menú de GRUB del sistema instalado.
GRUB_DISTRIBUTOR="Vortara"
# Fondo propio en lugar del de Debian (los colores, en /etc/grub.d/06_vortara).
GRUB_BACKGROUND="/usr/share/backgrounds/vortara/grub.png"

# Menú en el idioma del sistema aunque update-grub se ejecute sin él (lo hacen
# el instalador y algunas actualizaciones del kernel). grub-mkconfig lee este
# archivo antes de generar el menú.
if [ -r /etc/default/locale ]; then
	unset LANGUAGE LC_ALL LC_MESSAGES
	. /etc/default/locale
	export LANG
	if [ -n "${LC_MESSAGES:-}" ]; then
		export LC_MESSAGES
	fi
fi
