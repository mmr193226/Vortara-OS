# Vortara: cursor dibujado por software en las tarjetas gráficas virtuales.
#
# En VirtualBox, VMware, Hyper-V y QEMU, el cursor «por hardware» a menudo no
# se ve: el ratón funciona, pero la flecha no aparece. Con estas tarjetas se
# pide a Xorg que dibuje el cursor él mismo. En equipos reales no cambia nada
# (los nombres de abajo son solo de tarjetas virtuales).
Section "OutputClass"
	Identifier "Vortara: cursor por software en máquinas virtuales"
	MatchDriver "vmwgfx|vboxvideo|virtio_gpu|virtio-gpu|qxl|bochs|bochs-drm|cirrus|cirrus-qemu|hyperv_drm"
	# Controlador modesetting (el habitual)
	Option "SWcursor" "on"
	# Controladores vmware y qxl de Xorg
	Option "HWcursor" "off"
	Option "SWCursor" "on"
EndSection
