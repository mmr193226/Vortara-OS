# Vortara: cursor dibujado por software en las tarjetas gráficas virtuales.
#
# En VirtualBox, VMware, Hyper-V y QEMU, el cursor «por hardware» a menudo no
# se ve: el ratón funciona, pero la flecha no aparece. Con estas tarjetas se
# usa el controlador modesetting (el habitual) y se le pide que dibuje el
# cursor él mismo. En equipos reales no cambia nada: los nombres de abajo son
# solo de tarjetas virtuales.
#
# Importante: una sección OutputClass sin «Driver» hace que Xorg no encuentre
# ningún controlador y no arranque el escritorio («no screens found»).
Section "OutputClass"
	Identifier "Vortara: cursor por software en maquinas virtuales"
	MatchDriver "vmwgfx|vboxvideo|virtio_gpu|virtio-gpu|qxl|bochs|bochs-drm|cirrus|cirrus-qemu|hyperv_drm"
	Driver "modesetting"
	Option "SWcursor" "on"
EndSection
